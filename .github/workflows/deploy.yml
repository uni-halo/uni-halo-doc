name: Deploy VitePress to GitHub Pages

on:
  push:
    branches:
      - main # 指定分支
  workflow_dispatch: # 支持手动触发重跑

# 【修复 1】GITHUB_TOKEN 默认只有只读权限，
# 必须显式申请 contents: write 才允许向 gh-pages 分支推送。
permissions:
  contents: write

# 同一时间只允许一个部署任务，避免并发推送互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 【修复 2】pnpm 必须 >= 10.5.0（与官网仓库一致，本地开发环境亦为 11.x）。
      # 本仓库的 pnpm-workspace.yaml 只有 settings（allowBuilds）而没有 packages 字段，
      # pnpm < 10.5 会把它判定为非法工作区，抛 "ERROR packages field missing or empty"；
      # 该命令由 setup-node 的缓存探测（pnpm store path）触发，失败即整条流水线被取消。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 配置镜像源
        run: pnpm config set registry https://registry.npmmirror.com

      # 拉取代码（persist-credentials: false 避免 checkout 的凭据覆盖部署用的 token）
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # 确保 VitePress 的 lastUpdated 功能正常

      # 【修复 3】pin 到 v5：v4 内部跑在 Node 20 上，已被 GitHub 标记废弃，
      # 即日志里的 "Node 20 is being deprecated" 告警；v5 起跑在 Node 24 上。
      - name: 配置 Node.js 与 pnpm 缓存
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install

      - name: 构建项目
        run: pnpm build

      # 部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 使用 GitHub 内置令牌（需上方 permissions: contents: write 配合）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 源目录
          publish_dir: ./.vitepress/dist
          # 部署到 gh-pages 分支（GitHub Pages 标准分支）
          publish_branch: gh-pages
          # 清除 gh-pages 分支旧文件
          force_orphan: true
          # 自定义域名（与仓库根目录 CNAME 保持一致，由 action 自动写入）
          cname: uni-halo-doc.ialley.cn
          # 部署提交的作者身份
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
